# Deploy the Vite app + Gemini API server to Google Cloud Run.
#
# Prerequisites (one-time in GCP + GitHub):
# - Artifact Registry Docker repository
# - Secret Manager secret (e.g. gemini-api-key) with your Gemini Developer API key
# - Cloud Run service account: roles/secretmanager.secretAccessor on that secret
# - GitHub Actions service account JSON in repo secret GCP_SA_KEY (or use Workload Identity Federation)
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID, GCP_REGION, ARTIFACT_REGISTRY_REPO, CLOUD_RUN_SERVICE
#
# Optional repository variable:
#   GEMINI_SECRET_NAME  (default: gemini-api-key)

name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level `if` cannot use `secrets` (GitHub limitation). Gate on vars only; if
    # `GCP_SA_KEY` is missing, the auth step will fail with a clear error.
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Set image URL
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$REGION" ] || [ -z "$REPO" ] || [ -z "$SERVICE" ]; then
            echo "Set GitHub Actions variables: GCP_PROJECT_ID, GCP_REGION, ARTIFACT_REGISTRY_REPO, CLOUD_RUN_SERVICE"
            exit 1
          fi
          # REPO must be the Artifact Registry *repository id* only (e.g. gh-adventure-stories),
          # not a full hostname or path — the workflow already prefixes REGION-docker.pkg.dev/PROJECT_ID/
          case "$REPO" in
            */*|*docker.pkg.dev*)
              echo "::error::ARTIFACT_REGISTRY_REPO must be only the repository id (single segment, no slashes)."
              echo "Got: $REPO"
              echo "Example: gh-adventure-stories — not us-central1-docker.pkg.dev/PROJECT/gh-adventure-stories"
              exit 1
              ;;
          esac
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/adventure-stories:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        env:
          REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build -t "${{ steps.image.outputs.IMAGE }}" .
          docker push "${{ steps.image.outputs.IMAGE }}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.IMAGE }}
          flags: --allow-unauthenticated
          env_vars: |-
            GEMINI_MODEL=gemini-2.5-flash-lite
            GEMINI_MAX_OUTPUT_TOKENS=2048
          secrets: |-
            GEMINI_API_KEY=gemini-api-key:latest
